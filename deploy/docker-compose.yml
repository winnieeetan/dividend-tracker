# Dividend dashboard, served to the tailnet.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
#   tailscale serve --bg 8080
#
# Then teammates open https://winnies-imac.tail823d40.ts.net
#
# The published port is bound to 127.0.0.1 on purpose: the only route in is
# `tailscale serve`, so the dashboard is reachable on the tailnet and nowhere
# else -- not on the local network, not from the internet.

services:
  # Holds the shared calendar ticks. Separate from nginx so the web tier stays
  # read-only and only this one owns writable state.
  checks:
    image: python:3.12-alpine
    container_name: dividend-checks
    restart: unless-stopped
    command: ["python3", "/app/checks-api.py"]
    environment:
      CHECKS_STORE: /data/checks.json
      ROSTER_STORE: /data/roster.json
      EVENTS_STORE: /data/events.json
      OVERRIDES_STORE: /data/overrides.json
      # Only this login may read the activity log.
      OWNER_LOGIN: wyytan98@gmail.com
      PORT: "8081"
    volumes:
      - ./checks-api.py:/app/checks-api.py:ro
      - checks-data:/data
    expose:
      - "8081"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "2m", max-file: "2" }

  dividend-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: dividend-dashboard:latest
    container_name: dividend-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Read-only: the container serves these, the scheduled fetch writes them.
      - ../index.html:/srv/site/index.html:ro
      - ../dividends.json:/srv/site/dividends.json:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /var/log/nginx
    security_opt:
      - no-new-privileges:true
    depends_on:
      - checks
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  # Survives rebuilds and restarts; the ticks are the only state here.
  checks-data:

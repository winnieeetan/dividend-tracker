# Static hosting for the dividend dashboard.
# Reached only through `tailscale serve`, which terminates TLS and talks to
# this container on the loopback interface, so no TLS or auth here.

server {
    listen 8080;
    server_name _;
    root /srv/site;
    index index.html;

    # The dashboard re-reads this file every 60s to pick up a scheduled fetch.
    # Caching it would defeat that, so it is always revalidated.
    location = /dividends.json {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
        default_type application/json;
    }

    # index.html carries the embedded snapshot, so it goes stale the same way.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
    }

    # Shared calendar ticks. Everyone who can reach the site sees the same
    # ticks, so "added to calendar" means added, not "added on my laptop".
    location /api/ {
        proxy_pass http://checks:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        # Identity comes from Tailscale Serve, which sets these on every
        # proxied request. Passing the variable rather than the raw client
        # header means a request that did not come through Serve arrives with
        # them empty instead of with whatever the caller typed.
        proxy_set_header Tailscale-User-Login $http_tailscale_user_login;
        proxy_set_header Tailscale-User-Name  $http_tailscale_user_name;
        add_header Cache-Control "no-store" always;

        # /api/checks/stream holds the connection open and writes an event on
        # every change. Buffering would hold those events back, and the default
        # read timeout would cut the stream every 60s.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # The site is one page and one JSON file; nothing else should be reachable.
    location ~ /\. { deny all; }

    gzip on;
    gzip_types text/html application/json text/css application/javascript;
    gzip_min_length 1024;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}

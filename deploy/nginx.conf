# Static hosting for the dividend dashboard.
# Reached only through `tailscale serve`, which terminates TLS and talks to
# this container on the loopback interface, so no TLS or auth here.

server {
    listen 8080;
    server_name _;
    root /srv/site;
    index index.html;

    # The dashboard re-reads this file every 60s to pick up a scheduled fetch.
    # Caching it would defeat that, so it is always revalidated.
    location = /dividends.json {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
        default_type application/json;
    }

    # index.html carries the embedded snapshot, so it goes stale the same way.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
    }

    # Shared calendar ticks. Everyone who can reach the site sees the same
    # ticks, so "added to calendar" means added, not "added on my laptop".
    location /api/ {
        proxy_pass http://checks:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # The site is one page and one JSON file; nothing else should be reachable.
    location ~ /\. { deny all; }

    gzip on;
    gzip_types text/html application/json text/css application/javascript;
    gzip_min_length 1024;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}

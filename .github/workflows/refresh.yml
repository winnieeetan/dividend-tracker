name: Refresh dividend data

# Weekday mornings, 01:00 UTC (09:00 Malaysia / Singapore) — after the previous
# session's announcements have landed. Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-dividends
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet yfinance requests beautifulsoup4

      - name: Fetch latest dividends
        run: python3 fetch_dividends.py --min-ok 40

      - name: Commit if the data moved
        run: |
          if [ -z "$(git status --porcelain dividends.json index.html)" ]; then
            echo "No change — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dividends.json index.html
          git commit -m "chore: scheduled dividend refresh $(date -u +%Y-%m-%d)"
          git push

name: Refresh dividend data

# Manual only. The refresh now runs on the iMac that hosts the dashboard
# (deploy/refresh-agent.sh via launchd), which already has working network to
# both sources and writes straight into what the container serves.
#
# Leaving this on a schedule too would have both committing dividends.json and
# index.html, so the host's working tree would drift from main and every local
# refresh would collide with a bot commit. Run it from the Actions tab if the
# iMac is ever down for a while.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-dividends
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python3 -m pip install --quiet yfinance requests beautifulsoup4

      # --min-ok 40 aborts without writing if a source throttles the runner,
      # so a bad fetch can never replace good data.
      - name: Fetch latest dividends
        run: python3 fetch_dividends.py --min-ok 40

      - name: Commit if the data moved
        run: |
          if [ -z "$(git status --porcelain dividends.json index.html)" ]; then
            echo "No change — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dividends.json index.html
          git commit -m "chore: scheduled dividend refresh $(date -u +%Y-%m-%d)"
          git push
